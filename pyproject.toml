[project]
name = "ai-cv-reviewer"
version = "0.1.0"
description = "Multi-agent CV reviewer with guardrails, human approval and tracing (LangGraph + Groq)"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8.3",
    "langchain-groq>=1.2.0",
    "langgraph>=1.2.22",
    "pydantic>=2.14.3",
    "pypdf>=7.1.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
cv-review = "cv_reviewer.cli:main"

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_reviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Groq API (needs GROQ_API_KEY; run with -m live)"]
addopts = "-m 'not live'"
